# خادم الملفات الثابتة للواجهة (يعمل خلف nginx-proxy؛ ترويسات الأمان تُضاف هناك)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ملفات Vite مُبصَّمة بالمحتوى (hash) ⇒ كاش سنة كاملة وغير قابلة للتغيّر
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
    }

    # الصفحة الرئيسية وأي مسار React Router: لا كاش حتى تصل النسخة الجديدة فورًا بعد النشر
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
